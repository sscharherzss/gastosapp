name: Android APK y Google Play AAB
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: android-actions/setup-android@v3
      - name: Android SDK y NDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'ndk;30.0.14904198'
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - name: Dependencias bloqueadas
        run: npm ci
      - name: Restaurar la clave de publicación existente
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo 'Falta ANDROID_KEYSTORE_BASE64'; exit 1; }
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/my-release-key.keystore"
          chmod 600 "$RUNNER_TEMP/my-release-key.keystore"
      - name: Compilar y firmar APK y AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/my-release-key.keystore
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" && test -n "$ANDROID_KEY_ALIAS" && test -n "$ANDROID_KEY_PASSWORD"
          export NDK_HOME="$ANDROID_HOME/ndk/30.0.14904198"
          npm run tauri android build -- --apk --aab --ci
      - name: Verificar firma
        env:
          EXPECTED_CERT_SHA256: b2cdb9dc7e0597fa7d6e18d058f2ef8125c291be9cac4c7be3b7ed070c1c4bbc
        run: |
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/zipalign" -c -P 16 -v 4 src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk
          ACTUAL_CERT_SHA256=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs src-tauri/gen/android/app/build/outputs/apk/universal/release/app-universal-release.apk | sed -n 's/^Signer #1 certificate SHA-256 digest: //p')
          test "$ACTUAL_CERT_SHA256" = "$EXPECTED_CERT_SHA256"
          AAB_VERIFY_OUTPUT=$(jarsigner -verify src-tauri/gen/android/app/build/outputs/bundle/universalRelease/app-universal-release.aab 2>&1)
          printf '%s\n' "$AAB_VERIFY_OUTPUT"
          printf '%s\n' "$AAB_VERIFY_OUTPUT" | grep -q 'jar verified'
      - uses: actions/upload-artifact@v4
        with:
          name: gastos-android-release
          if-no-files-found: error
          path: |
            src-tauri/gen/android/app/build/outputs/apk/universal/release/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/universalRelease/*.aab
      - name: Limpiar clave temporal
        if: always()
        run: rm -f "$RUNNER_TEMP/my-release-key.keystore"
