name = "mis-finanzas-api"
main = "src/index.js"
compatibility_date = "2026-09-25"

[[d1_databases]]
binding = "DB"
database_name = "mis-finanzas-db"
database_id = "REEMPLAZAR_CON_D1_DATABASE_ID"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "RECEIPTS"
bucket_name = "mis-finanzas-receipts"

[vars]
ENVIRONMENT = "production"
ALLOWED_ORIGIN = "https://REEMPLAZAR_CON_TU_DOMINIO"
MAX_RECEIPT_BYTES = "10485760"
